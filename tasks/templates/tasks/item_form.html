{% extends "tasks/base.html" %}
{% block content %}
<p><a href="{% url 'task_detail' back.pk %}">&larr; Back to "{{ back.title }}"</a></p>
<div class="card">
  <h2>{{ heading }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
</div>
{% endblock %}
